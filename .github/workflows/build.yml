name: Build MDVHeadOres

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar plugin
        run: mvn clean package

      - name: Subir plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: MDVHeadOres-jar
          path: target/MDVHeadOres-*.jar
