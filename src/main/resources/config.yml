# MDVHeadOres
# Genera vetas visuales usando PLAYER_HEAD con la textura tomada desde MMOItems.
# v1.0.9: protege vetas y nodos marcados para que el agua/lava no destruyan sus cabezas.

debug: false

# Ruta al archivo de bloques de MMOItems, relativa a la carpeta raíz del servidor.
mmoitems-block-file: "plugins/MMOItems/item/block.yml"

# Generar solo al cargar chunks nuevos.
generate-on-new-chunks: true

# Marca chunks para no generar dos veces con /mdvheadores generate.
mark-generated-chunks: true

# Protege las cabezas internas del plugin frente a líquidos.
# El flujo se detiene únicamente al intentar ocupar una veta o nodo marcado por MDVHeadOres.
# Cuando el jugador rompe el recurso normalmente, el líquido puede continuar avanzando.
resource-protection:
  prevent-fluid-destruction: true
  fluids:
    - WATER
    - LAVA


# Modo optimizado para exploración en vivo.
# En vez de generar minerales custom inmediatamente al cargar el chunk,
# los pone en una cola y procesa pocos chunks cada intervalo.
# Esto evita tirones fuertes cuando varios jugadores exploran o usan /rtp.
generation-throttle:
  enabled: true
  # Espera antes de procesar un chunk nuevo. Ayuda a que la generación vanilla termine primero.
  delay-after-chunk-load-ticks: 40
  # Cada cuántos ticks procesa la cola. 4 ticks = 0.2s aprox.
  interval-ticks: 4
  # Chunks procesados por intervalo. Para server público, 1 es lo más seguro.
  chunks-per-interval: 1
  # Cola máxima. Si 40 jugadores exploran a la vez, conviene dejarla alta.
  max-queue-size: 10000
  # Si la cola está llena, omite chunks nuevos en vez de congelar el servidor.
  skip-if-queue-full: true
  # /mdvheadores generate también usa la cola para no pegar tirones.
  command-generate-uses-queue: true

# Si está true, los picos vanilla tienen poder básico:
# madera 1, piedra 2, hierro 3, oro 2, diamante 4, netherita 5.
vanilla-pickaxes-have-power: true

# Si está true, las hachas vanilla tienen poder básico:
# madera 1, piedra 2, hierro 3, oro 2, diamante 4, netherita 5.
vanilla-axes-have-power: true

# Fallback si por algún motivo el plugin no logra construir el item de MMOItems para dropearlo.
# Normalmente NO se usa. Solo queda como seguridad.
# Variables: %player%, %world%, %x%, %y%, %z%, %ore%, %drop_type%, %drop_id%, %amount%
default-fallback-command: "mi give %drop_type% %drop_id% %player% %amount%"

# Comando usado para dar XP de MMOCore cuando se rompe una veta/nodo custom.
# Variables: %player%, %target%, %profession%, %amount%, %split%, %source%
# %target% puede ser una profesión como mining/woodcutting o "main" para nivel principal.
mmocore-exp-command: "mmocore admin exp give %player% %target% %amount% %split%"

# Mensaje si el pico no tiene poder suficiente.
no-power-message: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &cTu pico no tiene suficiente poder para minar esta veta. &7Requiere: &f%required%&7. Tu poder: &f%power%&c."

# Mensaje si el hacha no tiene poder suficiente para nodos de árboles.
no-axe-power-message: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &cTu hacha no tiene suficiente poder para extraer este recurso. &7Requiere: &f%required%&7. Tu poder: &f%power%&c."

ores:
  viridita:
    enabled: true

    # ID del bloque dentro de plugins/MMOItems/item/block.yml
    # En tu caso: VETACRISTALVE
    mmoitems-block-id: "VETACRISTALVE"

    # Item de MMOItems que se dropea en el mundo al romper la cabeza.
    # En tu caso: CRISTALVERDE
    drop-id: "CRISTALVERDE"
    drop-type: "MATERIAL"
    drop-amount: 1

    # Usa skull-texture.value y name desde el bloque de MMOItems.
    texture-from-mmoitems: true
    name-from-mmoitems: true

    worlds:
      - world

    replace:
      - STONE
      - DEEPSLATE

    min-y: -48
    max-y: 48

    # 0.21 = 21% de chunks nuevos tienen intento de veta.
    chunk-chance: 0.21

    # Vetas chicas.
    veins-per-chunk: 1
    vein-min: 1
    vein-max: 2

    # FLOOR_HEAD reemplaza piedra por una cabeza puesta en el suelo.
    placement: FLOOR_HEAD

    # Evita bugs raros con minerales vanilla pegados a las cabezas.
    # Si está true, no coloca una cabeza si al lado/arriba/abajo hay un mineral vanilla
    # como LAPIS_ORE, DIAMOND_ORE, IRON_ORE, etc.
    avoid-near-vanilla-ores: true

    # Lista extra opcional de bloques a evitar alrededor de la cabeza.
    avoid-near-materials: []

    # Aplica física/actualización de vecinos al colocar la cabeza.
    # Ayuda a evitar bloques fantasma o actualizaciones raras cerca de minerales vanilla.
    apply-physics-on-place: true

    # Evita que Minecraft dropee la cabeza vanilla.
    prevent-vanilla-drops: true

    # Si el pico tiene Silk Touch, se ignora: igual dropea CRISTALVERDE.
    ignore-silk-touch: true

    # true = dropea el MMOItem físicamente en el suelo.
    # false = usa fallback-command y lo entrega por comando.
    drop-naturally: true

    # Poder mínimo de pico requerido.
    # MMOItems: usa la stat pickaxe-power / Poder de pico.
    # Vanilla: madera 1, piedra 2, hierro 3, oro 2, diamante 4, netherita 5.
    required-pickaxe-power: 1

    # XP opcional para MMOCore al romper esta veta custom.
    # profession-id debe coincidir con el archivo de profesión: mining.yml -> mining.
    # main-amount da XP al nivel principal; déjalo en 0 si no quieres.
    mmocore-xp:
      enabled: true
      profession-id: "mining"
      profession-amount: "3-6"
      main-amount: "0"
      split: false

    break-sound: "BLOCK_AMETHYST_BLOCK_BREAK"
    fail-sound: "BLOCK_NOTE_BLOCK_BASS"


# Nodos de árboles: recursos como retoños, savia, hongos o ramitas pegadas al costado de troncos.
# Funcionan igual que las vetas, pero se colocan como PLAYER_WALL_HEAD al lado de troncos.
# Para minarlos, el item debe tener lore como:
# '&3 &7■ &fPoder de Hacha: 2'
tree-nodes:
  brote_resinoso:
    enabled: false

    # ID del bloque/cabeza dentro de plugins/MMOItems/item/block.yml
    mmoitems-block-id: "BROTERESINOSO"

    # Item de MMOItems que se dropea al romper el nodo.
    drop-id: "BROTERESINOSO"
    drop-type: "MATERIAL"
    drop-amount: 1

    texture-from-mmoitems: true
    name-from-mmoitems: true

    worlds:
      - world

    # Troncos donde puede aparecer pegado.
    attach-to:
      - OAK_LOG
      - SPRUCE_LOG
      - BIRCH_LOG
      - JUNGLE_LOG
      - ACACIA_LOG
      - DARK_OAK_LOG
      - MANGROVE_LOG
      - CHERRY_LOG
      - PALE_OAK_LOG

    min-y: 50
    max-y: 120

    # Probabilidad por chunk y cantidad de nodos.
    chunk-chance: 0.12
    nodes-per-chunk: 1

    # Requiere hacha/item con Poder de Hacha.
    required-axe-power: 2

    # XP opcional para MMOCore al romper este nodo custom.
    # profession-id debe coincidir con el archivo de profesión: woodcutting.yml -> woodcutting.
    # main-amount da XP al nivel principal; déjalo en 0 si no quieres.
    mmocore-xp:
      enabled: true
      profession-id: "woodcutting"
      profession-amount: "3-6"
      main-amount: "0"
      split: false

    # Si está true, intenta colocarlo en troncos con aire alrededor, más visible como retoño/ramita.
    only-on-surface-logs: true

    apply-physics-on-place: true

    prevent-vanilla-drops: true
    ignore-silk-touch: true
    drop-naturally: true

    break-sound: "BLOCK_WOOD_BREAK"
    fail-sound: "BLOCK_NOTE_BLOCK_BASS"
