# ==========================================================
# LOOT NODES - cofres, barriles, bolsas/cabezas y vasijas
# Cada nodo vive en su propio YAML dentro de plugins/MDVHeadOres/lootnodes/.
# El viejo lootnodes.yml se importa automáticamente como migración y se conserva como respaldo.
# ==========================================================
loot-nodes:
  enabled: true
  directory: "lootnodes"
  legacy-file: "lootnodes.yml"

  # /mdvheadores loot editor <id>
  editor:
    enabled: true

    # Cantidad de recompensas visibles por página en /mdvheadores loot editor <id>.
    # Máximo 45 porque la última fila se reserva para controles.
    rewards-per-page: 45

# Compatibilidad global con pregeneradores como Chunky.
# Afecta vetas, nodos de árboles y loot nodes por igual.
# ChunkPopulateEvent entra a LA MISMA cola con deduplicación y throttle.
chunky-compatibility:
  enabled: true
  listen-chunk-populate: true
