# MDVHeadOres
# Genera vetas visuales usando PLAYER_HEAD con la textura tomada desde MMOItems.
# v1.3.3: loot nodes separados por YAML; cofres/vasijas persistentes; fix de inventario físico.
# v1.3.1: editor paginado de loot nodes y soporte completo para libros encantados/vanilla con metadata.
# v1.3.0: añade spawn manual de loot nodes, cabezas colocables de recursos y loot de equipo aleatorio/no identificado.

debug: false

debug-options:
  # Muestra el resumen de los chunks que realmente colocaron recursos.
  log-generated-chunks: true
  # Normalmente false para no llenar la consola al explorar o teletransportarse.
  log-unloaded-chunks: false

# Ruta al archivo de bloques de MMOItems, relativa a la carpeta raíz del servidor.
mmoitems-block-file: "plugins/MMOItems/item/block.yml"

# Generar solo al cargar chunks nuevos.
generate-on-new-chunks: true

# Se conserva por compatibilidad con versiones anteriores.
# El sistema nuevo usa una máscara de 64 bits por chunk y un bit por recurso.
mark-generated-chunks: true

generation-tracking:
  enabled: true

  # Los chunks existentes también se revisan al cargarse.
  # Solo se tiran los recursos cuyo tracking-bit todavía no esté registrado.
  process-existing-chunks-on-load: true

  # Migración desde 1.0.9 y anteriores:
  # todo chunk que ya existía antes de esta actualización se considera procesado
  # para estos cinco recursos. De este modo solo tira Nimbrel, Oricalco, Mithril,
  # Nudo Rúnico, Savia Áurea y Nudo Primordial.
  assume-legacy-resources-on-existing-chunks: true
  legacy-assumed-resources:
    - viridita
    - amatista_encantada
    - umbrita
    - nudo_vivo
    - tronco_corrupto

# Si está true, los picos vanilla tienen poder básico:
# madera 1, piedra 2, hierro 3, oro 2, diamante 4, netherita 5.
vanilla-pickaxes-have-power: true

# Si está true, las hachas vanilla tienen poder básico:
# madera 1, piedra 2, hierro 3, oro 2, diamante 4, netherita 5.
vanilla-axes-have-power: true

# Fallback si por algún motivo el plugin no logra construir el item de MMOItems para dropearlo.
# Normalmente NO se usa. Solo queda como seguridad.
# Variables: %player%, %world%, %x%, %y%, %z%, %ore%, %drop_type%, %drop_id%, %amount%
default-fallback-command: "mi give %drop_type% %drop_id% %player% %amount%"

# Comando usado para otorgar XP de MMOCore.
# Variables: %player%, %target%, %profession%, %amount%, %split%, %source%
mmocore-exp-command: "mmocore admin exp give %player% %target% %amount% %split%"

# Mensaje si el pico no tiene poder suficiente.
no-power-message: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &cTu pico no tiene suficiente poder para minar esta veta. &7Requiere: &f%required%&7. Tu poder: &f%power%&c."

# Mensaje si el hacha no tiene poder suficiente para nodos de árboles.
no-axe-power-message: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &cTu hacha no tiene suficiente poder para extraer este recurso. &7Requiere: &f%required%&7. Tu poder: &f%power%&c."

generation-throttle:
  enabled: true
  delay-after-chunk-load-ticks: 40
  # Worker cada tick. El límite temporal evita que consuma el tick completo.
  interval-ticks: 1
  # Techo de catch-up; normalmente el presupuesto de 1.5 ms corta antes.
  chunks-per-interval: 8
  max-queue-size: 15000
  skip-if-queue-full: true
  command-generate-uses-queue: true

  # Inicia una auditoría de los chunks cargados cada 1200 ticks (60 segundos).
  # La auditoría NO recorre todo en un mismo tick: se divide en lotes pequeños.
  rescan-loaded-chunks-interval-ticks: 1200

  # Máximo de chunks revisados por tick durante una auditoría.
  # 128 permite revisar unos 2560 chunks por segundo como techo teórico.
  rescan-loaded-chunks-per-tick: 128

  # Presupuesto temporal máximo del escaneo por tick. Al alcanzar este tiempo,
  # continúa en el tick siguiente aunque no haya llegado a 128 chunks.
  rescan-max-millis-per-tick: 1.0

  # Los chunks rechazados por cola llena entran en una cola compacta de reintentos.
  # Se revisan en lotes y sin escanear todos los chunks cargados.
  retry-chunks-per-tick: 64
  retry-max-millis-per-tick: 0.5
  max-retry-size: 30000

  # Presupuesto de la cola principal por ejecución. Siempre puede completar el
  # primer chunk iniciado, pero no comienza más trabajo si agotó el presupuesto.
  max-processing-millis-per-run: 1.5

  # Límite de entradas extraídas por ejecución, incluso si estaban descargadas.
  max-dequeues-per-run: 16
  
resource-protection:
  prevent-fluid-destruction: true
  prevent-explosion-destruction: true
  prevent-piston-destruction: true
  prevent-physics-destruction: true
  fluids:
    - WATER
    - LAVA
